<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oura-koppeling</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         max-width: 36rem; margin: 0 auto; padding: 3rem 1.25rem;
         line-height: 1.6; color: #1c1c1e; background: #fdfcf8; }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8ea; background: #16161a; }
    .code { background: #24242a; border-color: #3a3a42; }
    button { background: #2b6cb0; }
  }
  h1 { font-size: 1.5rem; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: .95rem; word-break: break-all; background: #f2efe6;
          border: 1px solid #ddd8c8; border-radius: .5rem; padding: 1rem;
          margin: 1rem 0; user-select: all; }
  button { font: inherit; font-weight: 600; color: #fff; background: #2b6cb0;
           border: 0; border-radius: .5rem; padding: .7rem 1.4rem; cursor: pointer; }
  button:active { opacity: .8; }
  .fout { color: #c0392b; font-weight: 600; }
  .stil { color: #6b6b70; font-size: .9rem; }
</style>
</head>
<body>
<h1>Oura-koppeling</h1>
<div id="uit">Bezig…</div>

<script>
  const p = new URLSearchParams(location.search);
  const code = p.get("code");
  const fout = p.get("error");
  const uit = document.getElementById("uit");

  if (code) {
    uit.innerHTML =
      "<p>Gelukt. Kopieer deze code en plak hem in de terminal:</p>" +
      '<div class="code" id="c"></div>' +
      '<button id="kopieer">Kopieer code</button>' +
      '<p class="stil">De code is een paar minuten geldig en is zonder je ' +
      "client secret onbruikbaar. Daarna kun je dit tabblad sluiten.</p>";
    document.getElementById("c").textContent = code;
    document.getElementById("kopieer").onclick = async (e) => {
      try {
        await navigator.clipboard.writeText(code);
        e.target.textContent = "Gekopieerd ✓";
      } catch {
        e.target.textContent = "Kopiëren mislukt — selecteer hem hierboven";
      }
    };
  } else {
    uit.innerHTML = '<p class="fout">Geen code ontvangen.</p><p>' +
      (fout ? "Oura meldde: " + fout : "Onbekende fout.") +
      "</p><p class='stil'>Probeer het opnieuw vanaf de terminal.</p>";
  }
</script>
</body>
</html>
